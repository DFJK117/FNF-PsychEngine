name: Build Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  buildAndroid:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.1.7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # cmdline-tools 16 removed the legacy 'tools' package; install platform-tools here only
          packages: platform-tools

      - name: Install SDK platforms / build-tools / NDK r21e
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;21.4.7075529"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_SETUP=1" >> $GITHUB_ENV
          echo "ANDROID_SDK=$SDK" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$SDK/ndk/21.4.7075529" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$SDK/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Install Haxelibs (mobile-only set, no lua/discord/hxvlc/hscript, no debug server)
        run: |
          set -e
          haxelib setup ~/haxelib
          retry() { local n=0; until [ $n -ge 5 ]; do "$@" && return 0; n=$((n+1)); echo ">>> retry $n for: $*"; sleep 6; done; "$@"; }
          # Pinned git libs: on Linux haxelib shallow-clones and cannot checkout a non-HEAD
          # commit SHA ("fatal: unable to read tree"), so full-clone -> checkout SHA -> haxelib dev.
          gitpin() { local name="$1" url="$2" sha="$3" dir="$HOME/hxlibs/$1"; local n=0; until [ $n -ge 5 ]; do rm -rf "$dir"; if git clone --recursive "$url" "$dir" && git -C "$dir" checkout "$sha"; then haxelib dev "$name" "$dir" && return 0; fi; n=$((n+1)); echo ">>> retry $n gitpin $name"; sleep 6; done; echo "FAILED gitpin $name"; return 1; }
          # Haxelib only ships hxcpp 4.3.2 (runtime __atomic_compare_exchange_4 crash on Haxe 4.3).
          # Install the PREBUILT v4.3.21 zip (contains hxcpp.n; a raw git checkout would force a
          # non-interactive tool rebuild and fail with "Can't continue without hxcpp.n").
          curl -fsSL --retry 3 --retry-all-errors -o /tmp/hxcpp.zip https://github.com/HaxeFoundation/hxcpp/releases/download/v4.3.21/hxcpp-4.3.21.zip
          haxelib install /tmp/hxcpp.zip -always
          retry haxelib install lime 8.1.2
          retry haxelib install openfl 9.3.3
          retry haxelib install flixel 5.6.1
          retry haxelib install flixel-addons 3.2.2
          retry haxelib install flixel-tools 1.5.1
          retry haxelib install tjson 1.4.0
          gitpin flxanimate https://github.com/Dot-Stuff/flxanimate 768740a56b26aa0c072720e0d1236b94afe68e3e
          gitpin funkin.vis https://github.com/FunkinCrew/funkVis 22b1ce089dd924f15cdc9632397ef3504d464e90
          gitpin grig.audio https://gitlab.com/haxe-grig/grig.audio.git cbf91e2180fd2e374924fe74844086aab7891666
          haxelib set lime 8.1.2
          haxelib set openfl 9.3.3

      - name: Skip SScript setup mode
        run: printf 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa

      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION

      - name: Compile Android APK (RELEASE, optimized)
        run: haxelib run lime build android --app-version="1.0.${{github.run_id}}"

      - name: Locate APK
        run: find export -name "*.apk" -ls

      - name: Sign release APKs (zipalign + apksigner, installable)
        run: |
          set -e
          BT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/33.0.2"
          KS="$HOME/doubao.keystore"
          keytool -genkeypair -v -keystore "$KS" -storepass android -keypass android \
            -alias doubao -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Doubao Engine, O=Doubao, C=CN"
          mkdir -p signed
          map_name() {
            case "$1" in
              *arm64-v8a*)   echo "DoubaoEngine-Android-arm64.apk";;
              *armeabi-v7a*) echo "DoubaoEngine-Android-armv7.apk";;
              *x86_64*)      echo "DoubaoEngine-Android-x86_64.apk";;
              *x86*)         echo "DoubaoEngine-Android-x86.apk";;
              *)             echo "DoubaoEngine-Android.apk";;
            esac
          }
          for f in $(find export -name "*.apk" | sort); do
            name="$(map_name "$f")"
            echo "=== signing $f -> signed/$name ==="
            "$BT/zipalign" -p -f 4 "$f" "/tmp/aligned.apk"
            "$BT/apksigner" sign --ks "$KS" --ks-pass pass:android --key-pass pass:android \
              --ks-key-alias doubao --out "signed/$name" "/tmp/aligned.apk"
            "$BT/apksigner" verify --verbose "signed/$name" || true
          done
          ls -la signed

      - name: Publish APK Artifact
        uses: actions/upload-artifact@v4.3.4
        with:
          name: androidAPK
          path: signed/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="doubao-android"
          NOTES="Doubao Engine Android (RELEASE build, signed & directly installable). Optimized, no on-screen debug terminal. arm64 = modern 64-bit phones (recommended); armv7 = older 32-bit; the fat DoubaoEngine-Android.apk works on both."
          # Remove the old debug asset so users cannot download the buggy debug build by mistake
          gh release delete-asset "$TAG" "DoubaoEngine-Android-PsychEngine-debug.apk" -y || true
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" signed/*.apk --clobber
          else
            gh release create "$TAG" signed/*.apk --title "Doubao Engine - Android" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
          echo "=== Release assets ==="
          gh release view "$TAG" --json url,assets -q '.url, (.assets[].name)'
